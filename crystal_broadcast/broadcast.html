<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism Broadcast</title>
<style>
  /* STACKED, not overlaid: the commentary sits UNDER the scene rather than
     across the bottom of it. The scene is a fixed 640x360 stage that the
     injected sizer scales to whatever box it gets, so shrinking the battle
     region just rescales it — nothing is cropped. --panel is the strip
     height; override with ?panel=NNN. */
  :root { --panel: 300px; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; left: 0; width: 100%; border: 0; }
  #battle  { top: 0; height: calc(100% - var(--panel)); }
  #caption { bottom: 0; height: var(--panel); background: transparent;
             pointer-events: none; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8aa; font: 16px system-ui;
    background: #0b0e14; z-index: 2; text-align: center; padding: 2rem;
  }
</style>
</head>
<body>
  <iframe id="battle" title="battle"></iframe>
  <iframe id="caption" src="/overlay.html?panel" title="commentary"></iframe>
  <div id="hint">Add <code>?battle=battle-gen9ou-NNNN</code> to the URL to load a match.<br>
    Needs the self-hosted client: <code>python showdown/serve_client.py</code></div>
<script>
  // Single self-hosted page: the local Showdown battle embedded, with the
  // commentary overlay composited over it from the WS feed. No Showdown
  // login, no server patch.
  //
  // The battle iframe must point at the SELF-HOSTED client (serve_client.py,
  // default :8127), NOT at the sim server on :8000. The sim server has no
  // client of its own: its root is a stub that redirects to psim.us, which
  // serves the OLD client, whose index-old.html framebusts
  // ("IN FRAME / Please visit Showdown directly") and can never be composited
  // over. The new client does not framebust and loads no CDN scripts.
  //
  // /broadcast-client.html is serve_client.py serving testclient-new.html with
  // broadcast_client.css injected (chrome stripped, scene scaled to fill). The
  // testclient base is what (a) sets Config.testclient, skipping the
  // cross-domain storage handshake that requires a real https domain, (b)
  // takes the sim server as ?~~host:port, and (c) hash-routes to the room,
  // since PSRouter picks subscribeHash() when the path ends .html.
  // Pass ?chrome=1 to load the unstyled client instead (debugging).
  const qs = new URLSearchParams(location.search);
  const panel = parseInt(qs.get("panel") || "", 10);
  if (panel > 0) {
    document.documentElement.style.setProperty("--panel", panel + "px");
  }
  const room = qs.get("battle");
  if (room) {
    const client = (qs.get("client") || "http://localhost:8127").replace(/\/$/, "");
    const sim = qs.get("sim") || "localhost:8000";
    const page = qs.get("chrome") ? "/testclient-new.html" : "/broadcast-client.html";
    document.getElementById("battle").src =
      client + page + "?~~" + sim + "#" + room;
    document.getElementById("hint").style.display = "none";
  }
</script>
</body>
</html>
